<div class="grid-2">
  {% for field in form %}
    <div
      class="form-group"
      {% if field.name == 'name' or field.name == 'image_url' %}
        style="grid-column:1/-1"
      {% endif %}
    >
      <label class="form-label" for="{{ field.id_for_label }}">
        {{ field.label }}
      </label>

      {% if field.field.widget.input_type == 'select' %}
        <select
          name="{{ field.name }}"
          class="form-control"
          id="{{ field.id_for_label }}"
        >
          {% for value, label in field.field.choices %}
            <option
              value="{{ value }}"
              {% if field.value == value %}selected{% endif %}
            >
              {{ label }}
            </option>
          {% endfor %}
        </select>
      {% elif field.field.widget.input_type == 'textarea' %}
        <textarea
          name="{{ field.name }}"
          class="form-control"
          id="{{ field.id_for_label }}"
        >{{ field.value|default:'' }}</textarea>
      {% else %}
        <input
          type="{{ field.field.widget.input_type|default:'text' }}"
          name="{{ field.name }}"
          class="form-control"
          id="{{ field.id_for_label }}"
          value="{{ field.value|default:'' }}"
        >
      {% endif %}

      {% if field.errors %}
        <div style="color:var(--pharma-danger);font-size:0.8rem;margin-top:0.3rem">
          {{ field.errors.0 }}
        </div>
      {% endif %}
    </div>
  {% endfor %}
</div>
